<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ぷよぷよ完全再現 - Procedural Slime Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- おじゃま予告ぷよSVGグラデーション定義 -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
        <defs>
            <radialGradient id="grad-ojama-small" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="45%" stop-color="#e2e8f0" />
                <stop offset="100%" stop-color="#94a3b8" />
            </radialGradient>
            <radialGradient id="grad-ojama-big" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="40%" stop-color="#fca5a5" />
                <stop offset="85%" stop-color="#ef4444" />
                <stop offset="100%" stop-color="#b91c1c" />
            </radialGradient>
            <linearGradient id="grad-ojama-rock" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#94a3b8" />
                <stop offset="40%" stop-color="#64748b" />
                <stop offset="100%" stop-color="#334155" />
            </linearGradient>
            <radialGradient id="grad-ojama-star" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#fef08a" />
                <stop offset="60%" stop-color="#facc15" />
                <stop offset="100%" stop-color="#d97706" />
            </radialGradient>
            <radialGradient id="grad-ojama-moon" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#bae6fd" />
                <stop offset="60%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#0284c7" />
            </radialGradient>
            <radialGradient id="grad-ojama-comet" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#fbcfe8" />
                <stop offset="50%" stop-color="#f472b6" />
                <stop offset="100%" stop-color="#db2777" />
            </radialGradient>
        </defs>
    </svg>

    <div class="app-container">
        <!-- ==============================================
             タイトル画面
        =============================================== -->
        <div id="title-screen">
            <div class="logo-container">
                <h1 class="title-logo">PUYO PUYO</h1>
                <div class="subtitle-badge">PROCEDURAL SLIME CLASH</div>
            </div>

            <!-- モード選択 -->
            <div class="option-group">
                <div class="option-label">GAME MODE</div>
                <div class="select-btn-group" id="mode-select">
                    <button class="select-btn active" data-mode="solo">👤 1P とことん</button>
                    <button class="select-btn" data-mode="vs">⚔️ VS CPU 対戦</button>
                </div>
            </div>

            <!-- フィールドサイズ選択 (広大画面・たくさん置ける) -->
            <div class="option-group">
                <div class="option-label">FIELD SIZE</div>
                <div class="select-btn-group" id="size-select">
                    <button class="select-btn active" data-size="classic">クラシック (6×12)</button>
                    <button class="select-btn" data-size="wide">✨ ワイド大画面 (8×14)</button>
                </div>
            </div>

            <!-- CPU難易度 (VSモード時) -->
            <div class="option-group" id="diff-group" style="display: none;">
                <div class="option-label">CPU DIFFICULTY</div>
                <div class="select-btn-group" id="diff-select">
                    <button class="select-btn" data-diff="easy">かんたん</button>
                    <button class="select-btn active" data-diff="normal">ふつう</button>
                    <button class="select-btn" data-diff="hard">ゲキムズ</button>
                </div>
            </div>

            <!-- サウンド設定 -->
            <div class="option-group">
                <div class="option-label">AUDIO</div>
                <div class="select-btn-group">
                    <button id="title-btn-bgm" class="select-btn active">🎵 BGM: ON (MIDI)</button>
                    <button id="title-btn-se" class="select-btn active">🔊 効果音: ON</button>
                </div>
            </div>

            <button id="btn-start-game" class="start-btn">GAME START</button>
        </div>

        <!-- ==============================================
             ゲーム画面
        =============================================== -->
        <div id="game-screen">
            <!-- ヘッダー (ナビゲーション・ポーズ・設定) -->
            <div class="game-header">
                <div class="header-left">
                    <button id="btn-pause-header" class="icon-btn">⏸ <span class="header-btn-text">ポーズ (Esc)</span></button>
                    <button id="btn-title-header" class="icon-btn">🏠 <span class="header-btn-text">タイトル</span></button>
                </div>
                <div class="header-right">
                    <button id="game-btn-bgm" class="icon-btn">🎵 <span class="header-btn-text">BGM: ON</span></button>
                    <button id="game-btn-se" class="icon-btn">🔊 <span class="header-btn-text">SE: ON</span></button>
                </div>
            </div>

            <!-- メインバトルエリア -->
            <div class="battle-layout">
                <!-- 1P ボードエリア -->
                <div class="board-wrapper">
                    <div class="board-header-row">
                        <div class="player-tag tag-1p">
                            <span>YOU (1P)</span>
                        </div>
                    </div>

                    <!-- 1P おじゃまぷよ予告トレイ（本家予告ぷよアイコン＆予告数バッジ） -->
                    <div class="ojama-tray-wrapper" id="p1-ojama-wrapper">
                        <div class="ojama-tray" id="p1-ojama-tray">
                            <div class="ojama-icons-list" id="p1-ojama-icons"></div>
                            <div class="ojama-count-badge" id="p1-ojama-badge" style="display: none;">0</div>
                        </div>
                    </div>

                    <div class="player-board-group">
                        <div class="board-container">
                            <canvas id="game-canvas"></canvas>
                        </div>
                        <div class="side-info-column">
                            <div class="next-wrapper">
                                <canvas id="next-canvas"></canvas>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">SCORE</div>
                                <div id="score-val" class="stat-value">0</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">MAX CHAIN</div>
                                <div id="chain-val" class="stat-value" style="color: #f59e0b;">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 中央 VS & おじゃまぷよ予告メーター (VS対戦時) -->
                <div id="vs-center-area" class="vs-center-area" style="display: none;">
                    <div class="vs-logo">VS</div>
                    <div class="ojama-meter">
                        <div class="ojama-label">1P 予告</div>
                        <div id="p1-ojama-val" class="ojama-count" style="color: #f43f5e;">0</div>
                    </div>
                    <div class="ojama-meter">
                        <div class="ojama-label">CPU 予告</div>
                        <div id="p2-ojama-val" class="ojama-count" style="color: #38bdf8;">0</div>
                    </div>
                </div>

                <!-- 2P CPU ボードエリア (VS対戦時) -->
                <div id="cpu-board-area" class="board-wrapper" style="display: none;">
                    <div class="board-header-row">
                        <div class="player-tag tag-2p">
                            <span>CPU (2P)</span>
                        </div>
                    </div>

                    <!-- CPU おじゃまぷよ予告トレイ（本家予告ぷよアイコン＆予告数バッジ） -->
                    <div class="ojama-tray-wrapper" id="cpu-ojama-wrapper">
                        <div class="ojama-tray" id="cpu-ojama-tray">
                            <div class="ojama-icons-list" id="cpu-ojama-icons"></div>
                            <div class="ojama-count-badge" id="cpu-ojama-badge" style="display: none;">0</div>
                        </div>
                    </div>

                    <div class="player-board-group">
                        <div class="board-container cpu-board-container">
                            <canvas id="cpu-canvas"></canvas>
                        </div>
                        <div class="next-wrapper">
                            <canvas id="cpu-next-canvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- モバイル用オンスクリーンタッチコントローラー -->
            <div class="touch-controls">
                <div class="touch-grid">
                    <!-- 左手十字キー (左右移動・急降下・高速落下) -->
                    <div class="dpad-container">
                        <div></div>
                        <button class="touch-btn hard-drop" id="btn-hard-drop-left" title="急降下">⚡</button>
                        <div></div>
                        <button class="touch-btn" id="btn-move-left" title="左移動">◀</button>
                        <button class="touch-btn" id="btn-soft-drop" title="高速落下">▼</button>
                        <button class="touch-btn" id="btn-move-right" title="右移動">▶</button>
                    </div>

                    <!-- 右手アクションボタン (回転・ハードドロップ) -->
                    <div class="action-container">
                        <button class="touch-btn rot" id="btn-rot-left" title="左回転 (Z)">↶</button>
                        <button class="touch-btn rot" id="btn-rot-right" title="右回転 (X)">↷</button>
                        <button class="touch-btn hard-drop span-2" id="btn-hard-drop-right" title="瞬時落下 (HARD DROP)">⚡ DROP</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==============================================
             ポーズモーダル (Esc連動)
        =============================================== -->
        <div id="pause-modal">
            <div class="pause-card">
                <div class="pause-title">PAUSED</div>
                <button id="btn-resume" class="modal-btn primary">▶ ゲーム再開 (Esc)</button>
                <button id="btn-retry" class="modal-btn">🔄 最初からやり直す</button>
                <button id="btn-return-title" class="modal-btn">🏠 タイトルに戻る</button>
            </div>
        </div>

        <!-- ==============================================
             勝敗リザルトモーダル (WIN / LOSE / GAME OVER)
        =============================================== -->
        <div id="result-modal">
            <div class="result-card">
                <div id="result-title" class="result-title">🎉 YOU WIN! 🎉</div>
                <div id="result-subtitle" class="result-subtitle">CONGRATULATIONS!</div>
                <div class="result-stats">
                    <div class="result-stat-row">
                        <span>スコア:</span>
                        <span id="result-score" style="color: #38bdf8; font-weight: 900;">0</span>
                    </div>
                    <div class="result-stat-row">
                        <span>最大連鎖:</span>
                        <span id="result-chain" style="color: #f59e0b; font-weight: 900;">0 連鎖</span>
                    </div>
                </div>
                <button id="btn-result-retry" class="modal-btn primary">🔄 もう一度遊ぶ</button>
                <button id="btn-result-title" class="modal-btn">🏠 タイトルへ戻る</button>
            </div>
        </div>
    </div>

    <!-- スクリプト群 -->
    <script src="audio.js"></script>
    <script src="midi_player.js"></script>
    <script src="particles.js"></script>
    <script src="puyo.js"></script>
    <script src="ai.js"></script>
    <script src="game.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const gameManager = new GameManager();
            window.gameManager = gameManager;

            let selectedMode = 'solo';
            let selectedSize = 'classic';
            let selectedDiff = 'normal';

            // モード切り替えボタン
            const modeBtns = document.querySelectorAll('#mode-select .select-btn');
            const diffGroup = document.getElementById('diff-group');
            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    modeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedMode = btn.dataset.mode;
                    diffGroup.style.display = (selectedMode === 'vs') ? 'flex' : 'none';
                });
            });

            // サイズ切り替えボタン
            const sizeBtns = document.querySelectorAll('#size-select .select-btn');
            sizeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    sizeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedSize = btn.dataset.size;
                });
            });

            // 難易度切り替えボタン
            const diffBtns = document.querySelectorAll('#diff-select .select-btn');
            diffBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    diffBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedDiff = btn.dataset.diff;
                });
            });

            // スタートボタン
            document.getElementById('btn-start-game').addEventListener('click', () => {
                if (window.soundEngine) window.soundEngine.resume();
                if (window.midiPlayer) window.midiPlayer.ensureAudioContext();
                gameManager.startGame(selectedMode, selectedSize, selectedDiff);
            });

            // ポーズ・再開・タイトルボタン
            document.getElementById('btn-pause-header').addEventListener('click', () => gameManager.togglePause());
            document.getElementById('btn-resume').addEventListener('click', () => gameManager.togglePause());
            document.getElementById('btn-retry').addEventListener('click', () => {
                gameManager.startGame(selectedMode, selectedSize, selectedDiff);
            });
            document.getElementById('btn-return-title').addEventListener('click', () => gameManager.returnToTitle());
            document.getElementById('btn-title-header').addEventListener('click', () => gameManager.returnToTitle());

            // 勝敗リザルトボタン
            document.getElementById('btn-result-retry').addEventListener('click', () => {
                gameManager.startGame(selectedMode, selectedSize, selectedDiff);
            });
            document.getElementById('btn-result-title').addEventListener('click', () => gameManager.returnToTitle());

            // BGM / SE 切り替え
            const syncAudioButtons = () => {
                const bgmActive = window.midiPlayer && !window.midiPlayer.isMuted;
                const seActive = window.soundEngine && !window.soundEngine.isMuted;

                const bgmIcon = bgmActive ? '🎵' : '🔇';
                const seIcon = seActive ? '🔊' : '🔇';
                const bgmStatus = bgmActive ? 'ON' : 'OFF';
                const seStatus = seActive ? 'ON' : 'OFF';

                const titleBgm = document.getElementById('title-btn-bgm');
                const gameBgm = document.getElementById('game-btn-bgm');
                const titleSe = document.getElementById('title-btn-se');
                const gameSe = document.getElementById('game-btn-se');

                if (titleBgm) titleBgm.textContent = `${bgmIcon} BGM: ${bgmStatus}`;
                if (gameBgm) gameBgm.innerHTML = `${bgmIcon} <span class="header-btn-text">BGM: ${bgmStatus}</span>`;
                if (titleSe) titleSe.textContent = `${seIcon} 効果音: ${seStatus}`;
                if (gameSe) gameSe.innerHTML = `${seIcon} <span class="header-btn-text">SE: ${seStatus}</span>`;
            };

            const toggleBgm = () => {
                if (window.midiPlayer) {
                    window.midiPlayer.toggleMute();
                    syncAudioButtons();
                }
            };
            const toggleSe = () => {
                if (window.soundEngine) {
                    window.soundEngine.toggleMute();
                    syncAudioButtons();
                }
            };

            document.getElementById('title-btn-bgm').addEventListener('click', toggleBgm);
            document.getElementById('game-btn-bgm').addEventListener('click', toggleBgm);
            document.getElementById('title-btn-se').addEventListener('click', toggleSe);
            document.getElementById('game-btn-se').addEventListener('click', toggleSe);

            // 触覚フィードバック (Haptic Vibration)
            const triggerHaptic = (ms = 10) => {
                if (navigator.vibrate) {
                    try { navigator.vibrate(ms); } catch (e) {}
                }
            };

            const ensureAudio = () => {
                if (window.soundEngine) window.soundEngine.resume();
                if (window.midiPlayer) window.midiPlayer.ensureAudioContext();
            };

            // オートリピート対応ボタン (左右移動用: DAS)
            const setupRepeatButton = (id, actionFn, delay = 140, interval = 45, hapticMs = 8) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                let startTimer = null;
                let repeatTimer = null;
                let active = false;

                const start = (e) => {
                    if (e.cancelable) e.preventDefault();
                    if (active) return;
                    active = true;
                    btn.classList.add('active-touch');
                    triggerHaptic(hapticMs);
                    ensureAudio();
                    actionFn();

                    clearTimeout(startTimer);
                    clearInterval(repeatTimer);
                    startTimer = setTimeout(() => {
                        if (!active) return;
                        repeatTimer = setInterval(() => {
                            if (!active) {
                                clearInterval(repeatTimer);
                                return;
                            }
                            actionFn();
                            triggerHaptic(5);
                        }, interval);
                    }, delay);
                };

                const stop = (e) => {
                    if (e && e.cancelable) e.preventDefault();
                    active = false;
                    btn.classList.remove('active-touch');
                    clearTimeout(startTimer);
                    clearInterval(repeatTimer);
                };

                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', stop, { passive: false });
                btn.addEventListener('touchcancel', stop, { passive: false });
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', stop);
                btn.addEventListener('mouseleave', stop);
            };

            // ホールド対応ボタン (ソフトドロップ用)
            const setupHoldButton = (id, onDown, onUp, hapticMs = 10) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                let active = false;

                const start = (e) => {
                    if (e.cancelable) e.preventDefault();
                    if (active) return;
                    active = true;
                    btn.classList.add('active-touch');
                    triggerHaptic(hapticMs);
                    ensureAudio();
                    onDown();
                };

                const stop = (e) => {
                    if (e && e.cancelable) e.preventDefault();
                    if (!active) return;
                    active = false;
                    btn.classList.remove('active-touch');
                    onUp();
                };

                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', stop, { passive: false });
                btn.addEventListener('touchcancel', stop, { passive: false });
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', stop);
                btn.addEventListener('mouseleave', stop);
            };

            // 単発タップボタン (回転・ハードドロップ用)
            const setupTapButton = (id, actionFn, hapticMs = 14) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                const tap = (e) => {
                    if (e.cancelable) e.preventDefault();
                    btn.classList.add('active-touch');
                    triggerHaptic(hapticMs);
                    ensureAudio();
                    actionFn();
                    setTimeout(() => btn.classList.remove('active-touch'), 110);
                };
                btn.addEventListener('touchstart', tap, { passive: false });
                btn.addEventListener('mousedown', tap);
            };

            // 左手十字キーのバインド
            setupRepeatButton('btn-move-left', () => {
                if (gameManager.playerBoard) gameManager.playerBoard.movePair(-1);
            });
            setupRepeatButton('btn-move-right', () => {
                if (gameManager.playerBoard) gameManager.playerBoard.movePair(1);
            });
            setupHoldButton(
                'btn-soft-drop',
                () => { if (gameManager.playerBoard) gameManager.playerBoard.fastDrop = true; },
                () => { if (gameManager.playerBoard) gameManager.playerBoard.fastDrop = false; }
            );
            setupTapButton('btn-hard-drop-left', () => {
                if (gameManager.playerBoard) gameManager.playerBoard.hardDrop();
            }, 20);

            // 右手アクションボタンのバインド
            setupTapButton('btn-rot-left', () => {
                if (gameManager.playerBoard) gameManager.playerBoard.rotatePair(-1);
            }, 12);
            setupTapButton('btn-rot-right', () => {
                if (gameManager.playerBoard) gameManager.playerBoard.rotatePair(1);
            }, 12);
            setupTapButton('btn-hard-drop-right', () => {
                if (gameManager.playerBoard) gameManager.playerBoard.hardDrop();
            }, 20);

            // ==========================================
            // 盤面キャンバス上の直接スワイプ・フリック・タップ操作
            // ==========================================
            const canvas = document.getElementById('game-canvas');
            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;
            let lastMovedGridX = 0;
            let isSwiping = false;

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                const t = e.touches[0];
                touchStartX = t.clientX;
                touchStartY = t.clientY;
                touchStartTime = Date.now();
                lastMovedGridX = touchStartX;
                isSwiping = true;
                ensureAudio();
            }, { passive: true });

            canvas.addEventListener('touchmove', (e) => {
                if (!isSwiping || e.touches.length !== 1) return;
                const b = gameManager.playerBoard;
                if (!b || b.state !== 'CONTROLLING') return;

                const t = e.touches[0];
                const curX = t.clientX;
                const curY = t.clientY;

                // 水平スワイプ：指がセルの幅（約26〜36px）動くごとに1マス移動
                const cellPx = Math.max(24, canvas.clientWidth / b.cols);
                const diffX = curX - lastMovedGridX;
                if (Math.abs(diffX) >= cellPx) {
                    const step = diffX > 0 ? 1 : -1;
                    b.movePair(step);
                    triggerHaptic(8);
                    lastMovedGridX = curX;
                }

                // 下ドラッグ：下方向に一定以上引かれたらソフトドロップ
                const diffY = curY - touchStartY;
                if (diffY > 40) {
                    b.fastDrop = true;
                }
            }, { passive: true });

            canvas.addEventListener('touchend', (e) => {
                if (!isSwiping) return;
                isSwiping = false;
                const b = gameManager.playerBoard;
                if (b) b.fastDrop = false;

                if (e.changedTouches.length !== 1) return;
                const t = e.changedTouches[0];
                const deltaX = t.clientX - touchStartX;
                const deltaY = t.clientY - touchStartY;
                const duration = Date.now() - touchStartTime;

                // 短いタップ判定（移動が少なく250ms以内）
                if (Math.abs(deltaX) < 18 && Math.abs(deltaY) < 18 && duration < 250) {
                    if (b && b.state === 'CONTROLLING') {
                        // キャンバスの左側タップで左回転、右側タップで右回転
                        const rect = canvas.getBoundingClientRect();
                        const relX = t.clientX - rect.left;
                        if (relX < rect.width * 0.45) {
                            b.rotatePair(-1);
                        } else {
                            b.rotatePair(1);
                        }
                        triggerHaptic(12);
                    }
                } else if (deltaY > 55 && Math.abs(deltaX) < 40 && duration < 260) {
                    // 素早い下フリック：瞬時落下 (ハードドロップ)
                    if (b && b.state === 'CONTROLLING') {
                        b.hardDrop();
                        triggerHaptic(22);
                    }
                }
            }, { passive: true });

            window.addEventListener('pointerdown', ensureAudio, { once: true });
        });
    </script>
</body>
</html>
